name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.11"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install uv==0.6.6
      - run: uv run --locked pytest
        working-directory: harnesses
      - run: >-
          uv run --python 3.11.11 --python-preference only-managed --locked
          --project catalog/codex-skills/skill-manager/orchestration
          --group build pytest
          catalog/codex-skills/skill-manager/orchestration/tests
      - run: uv run --locked pytest
        working-directory: catalog/engineering/model-with-tla/orchestration

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.x"
      - run: GOWORK=off go test ./...
        working-directory: harnesses/codex/jsonl-go
      - run: GOWORK=off go test ./...
        working-directory: harnesses/codex/rollout-go
      - run: GOWORK=off go test ./... -count=1
        working-directory: catalog/codex-sessions/session-management/orchestration-go
      - run: GOWORK=off go vet ./...
        working-directory: catalog/codex-sessions/session-management/orchestration-go
      - run: GOWORK=off go build ./cmd/session-management
        working-directory: catalog/codex-sessions/session-management/orchestration-go

  public-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git show --check --format=oneline HEAD
      - run: ./release/export HEAD "$RUNNER_TEMP/public"
      - run: test -f "$RUNNER_TEMP/public/LICENSE"
      - run: test -f "$RUNNER_TEMP/public/README.md"
      - run: test -f "$RUNNER_TEMP/public/THIRD_PARTY_NOTICES.md"
      - run: >-
          test -f
          "$RUNNER_TEMP/public/catalog/engineering/model-with-tla/.tools/LICENSE.tlaplus.txt"
      - run: test -f "$RUNNER_TEMP/public/SOURCE_REVISION"
