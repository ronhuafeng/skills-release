[project]
name = "skills-skill-manager-orchestration"
version = "0.13.0"
description = "Skill evidence and guarded placement primitives for Agent reconciliation."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "skills-frontmatter",
  "skills-openai-metadata",
  "skills-profile-toml",
  "skills-snapshot-mutation",
  "skills-snapshot-plan",
  "skills-symlink-mutation",
  "skills-symlink-plan",
]

[project.scripts]
skill-manager = "skills_skill_manager_orchestration.__main__:main"

[tool.uv.sources]
skills-frontmatter = { path = "../../../../harnesses/skills/frontmatter", editable = true }
skills-openai-metadata = { path = "../../../../harnesses/skills/openai_metadata", editable = true }
skills-profile-toml = { path = "../../../../harnesses/skills/profile_toml", editable = true }
skills-snapshot-mutation = { path = "../../../../harnesses/fs/snapshot_mutation", editable = true }
skills-snapshot-plan = { path = "../../../../harnesses/fs/snapshot_plan", editable = true }
skills-symlink-mutation = { path = "../../../../harnesses/fs/symlink_mutation", editable = true }
skills-symlink-plan = { path = "../../../../harnesses/fs/symlink_plan", editable = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
build = ["pyinstaller==6.21.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
