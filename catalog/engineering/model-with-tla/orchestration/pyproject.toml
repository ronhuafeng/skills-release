[project]
name = "model-with-tla-orchestration"
version = "0.1.0"
description = "Deterministic SANY and TLC checker for the model-with-tla Agent Contract."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tla-check = "model_with_tla_orchestration.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
