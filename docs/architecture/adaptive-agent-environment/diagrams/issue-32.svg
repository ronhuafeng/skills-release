<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="492" viewBox="0 0 1000 492" role="img" aria-labelledby="title desc"><title id="title">Bounded Codex evidence (#32)</title><desc id="desc">Stable record identities and a commit-bound checkpoint. Raw evidence is read-only. No cursor advances past uncommitted records; missing coverage is not zero.</desc><defs><marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526579"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8062ae"/></marker><marker id="gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a66b14"/></marker></defs><rect width="1000" height="492" rx="12" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#182c3e"><text x="40" y="29" font-size="14" font-weight="700" letter-spacing="1.2" fill="#147d76">ADAPTIVE AGENT ENVIRONMENT  /  ISSUE 32  /  PROPOSED DESIGN</text><text x="40" y="61" font-size="29" font-weight="700">Bounded Codex evidence</text><text x="40" y="86" font-size="17" fill="#526579">Stable record identities and a commit-bound checkpoint</text><path d="M40 99H960" stroke="#cbd5e1"/><path id="edge-scope-freeze" d="M332 150H354" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-freeze-scan" d="M646 150H668" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-scan-filter" d="M814 188V222" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-filter-commit" d="M668 260H646" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-commit-cursor" d="M354 260H332" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-cursor-again" d="M186 298V332" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-scan-bad" d="M960 150H985V370H960" fill="none" stroke="#a66b14" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#gate)"/><path id="edge-again-scope" d="M40 370H15V150H40" fill="none" stroke="#8062ae" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#feedback)"/><g id="node-scope"><rect x="40" y="112" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="40" y="122" width="4" height="56" rx="2" fill="#a66b14"/><text x="186" y="141" font-size="21" font-weight="700" text-anchor="middle">Explicit scope &amp; preview</text><text x="186" y="164" font-size="16" text-anchor="middle" fill="#405569">Host / project / window / budget</text></g><g id="node-freeze"><rect x="354" y="112" width="292" height="76" rx="8" fill="#edf2f7" stroke="#63768b" stroke-width="1.6"/><rect x="354" y="122" width="4" height="56" rx="2" fill="#63768b"/><text x="500" y="141" font-size="21" font-weight="700" text-anchor="middle">Frozen snapshot</text><text x="500" y="164" font-size="16" text-anchor="middle" fill="#405569">Source identity + prefix digest</text></g><g id="node-scan"><rect x="668" y="112" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="668" y="122" width="4" height="56" rx="2" fill="#147d76"/><text x="814" y="141" font-size="21" font-weight="700" text-anchor="middle">rollout-go ScanRange</text><text x="814" y="164" font-size="16" text-anchor="middle" fill="#405569">Byte + line cursor</text></g><g id="node-cursor"><rect x="40" y="222" width="292" height="76" rx="8" fill="#eaf0fb" stroke="#466da7" stroke-width="1.6"/><rect x="40" y="232" width="4" height="56" rx="2" fill="#466da7"/><text x="186" y="251" font-size="21" font-weight="700" text-anchor="middle">Advance checkpoint</text><text x="186" y="274" font-size="16" text-anchor="middle" fill="#405569">Only after durable commit</text></g><g id="node-commit"><rect x="354" y="222" width="292" height="76" rx="8" fill="#eaf0fb" stroke="#466da7" stroke-width="1.6"/><rect x="354" y="232" width="4" height="56" rx="2" fill="#466da7"/><text x="500" y="251" font-size="21" font-weight="700" text-anchor="middle">Commit evidence · #33</text><text x="500" y="274" font-size="16" text-anchor="middle" fill="#405569">Stable ID + coverage + locator</text></g><g id="node-filter"><rect x="668" y="222" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="668" y="232" width="4" height="56" rx="2" fill="#147d76"/><text x="814" y="251" font-size="21" font-weight="700" text-anchor="middle">Filter &amp; redact</text><text x="814" y="274" font-size="16" text-anchor="middle" fill="#405569">Facts, gaps, native call / result</text></g><g id="node-again"><rect x="40" y="332" width="292" height="76" rx="8" fill="#f0ecfa" stroke="#8062ae" stroke-width="1.6"/><rect x="40" y="342" width="4" height="56" rx="2" fill="#8062ae"/><text x="186" y="361" font-size="21" font-weight="700" text-anchor="middle">Next bounded run</text><text x="186" y="384" font-size="16" text-anchor="middle" fill="#405569">Replay is a no-op; append only</text></g><g id="node-bad"><rect x="668" y="332" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="668" y="342" width="4" height="56" rx="2" fill="#a66b14"/><text x="814" y="361" font-size="21" font-weight="700" text-anchor="middle">Partial / drift / error</text><text x="814" y="384" font-size="16" text-anchor="middle" fill="#405569">Defer tail; stop or new epoch</text></g><path d="M40 451H960" stroke="#cbd5e1"/><text x="40" y="472" font-size="14.5" fill="#526579">Raw evidence is read-only. No cursor advances past uncommitted records; missing coverage is not zero.</text></g></svg>