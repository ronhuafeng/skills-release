<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="602" viewBox="0 0 1000 602" role="img" aria-labelledby="title desc"><title id="title">Evidence to durable learning (#33)</title><desc id="desc">Four proofs remain distinct; decisions do not grant permissions. Lifecycle axes: evidence, decision, experiment, admission, deployment and actual exposure are separate.</desc><defs><marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526579"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8062ae"/></marker><marker id="gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a66b14"/></marker></defs><rect width="1000" height="602" rx="12" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#182c3e"><text x="40" y="29" font-size="14" font-weight="700" letter-spacing="1.2" fill="#147d76">ADAPTIVE AGENT ENVIRONMENT  /  ISSUE 33  /  PROPOSED DESIGN</text><text x="40" y="61" font-size="29" font-weight="700">Evidence to durable learning</text><text x="40" y="86" font-size="17" fill="#526579">Four proofs remain distinct; decisions do not grant permissions</text><path d="M40 99H960" stroke="#cbd5e1"/><path id="edge-raw-attr" d="M332 150H354" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-attr-cand" d="M646 150H668" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-cand-review" d="M814 188V222" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-review-decision" d="M668 260H646" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-decision-ledger" d="M354 260H332" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-le