adicted / unknown</text><text x="814" y="384" font-size="16" text-anchor="middle" fill="#405569">Narrow, abstain or gather evidence</text></g><g id="node-effect"><rect x="354" y="442" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="354" y="452" width="4" height="56" rx="2" fill="#147d76"/><text x="500" y="471" font-size="21" font-weight="700" text-anchor="middle">Empirical proof · #35</text><text x="500" y="494" font-size="16" text-anchor="middle" fill="#405569">Separate from evidence support</text></g><path d="M40 561H960" stroke="#cbd5e1"/><text x="40" y="582" font-size="14.5" fill="#526579">Lifecycle axes: evidence, decision, experiment, admission, deployment and actual exposure are separate.</text></g></svg>