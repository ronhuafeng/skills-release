<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="602" viewBox="0 0 1000 602" role="img" aria-labelledby="title desc"><title id="title">Comparative task evaluation (#35)</title><desc id="desc">A real effect requires an independent, revision-bound oracle. Predeclare metrics, repetitions and acceptance; preserve every attempt. Evidence review is necessary but not sufficient.</desc><defs><marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526579"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8062ae"/></marker><marker id="gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a66b14"/></marker></defs><rect width="1000" height="602" rx="12" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#182c3e"><text x="40" y="29" font-size="14" font-weight="700" letter-spacing="1.2" fill="#147d76">ADAPTIVE AGENT ENVIRONMENT  /  ISSUE 35  /  PROPOSED DESIGN</text><text x="40" y="61" font-size="29" font-weight="700">Comparative task evaluation</text><text x="40" y="86" font-size="17" fill="#526579">A real effect requires an independent, revision-bound oracle</text><path d="M40 99H960" stroke="#cbd5e1"/><path id="edge-spec-base" d="M435 188V205H251V222" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-spec-cand" d="M565 188V205H749V222" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-base-oracle" d="M251 298V315H435V332" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-cand-oracle" d="M749 298V315H565V332" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-oracle-pass" d="M435 408V425H251V442" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-oracle-fail" d="M500 408V442" fill="none" stroke="#a66b14" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#gate)"/><path id="edge-oracle-unknown" d="M565 408V425H749V442" fill="none" stroke="#a66b14" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#gate)"/><g id="node-spec"><rect x="354" y="112" width="292" height="76" rx="8" fill="#edf2f7" stroke="#63768b" stroke-width="1.6"/><rect x="354" y="122" width="4" height="56" rx="2" fill="#63768b"/><text x="500" y="141" font-size="21" font-weight="700" text-anchor="middle">Frozen task &amp; policy</text><text x="500" y="164" font-size="16" text-anchor="middle" fill="#405569">Cases / oracle / budget / versions</text></g><g id="node-base"><rect x="40" y="222" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="40" y="232" width="4" height="56" rx="2" fill="#147d76"/><text x="186" y="251" font-size="21" font-weight="700" text-anchor="middle">Baseline</text><text x="186" y="274" font-size="16" text-anchor="middle" fill="#405569">Accepted revision; isolated run</text></g><g id="node-cand"><rect x="668" y="222" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="668" y="232" width="4" height="56" rx="2" fill="#147d76"/><text x="814" y="251" font-size="21" font-weight="700" text-anchor="middle">Candidate</text><text x="814" y="274" font-size="16" text-anchor="middle" fill="#405569">Changed revision; equivalent run</text></g><g id="node-oracle"><rect x="354" y="332" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="354" y="342" width="4" height="56" rx="2" fill="#147d76"/><text x="500" y="361" font-size="21" font-weight="700" text-anchor="middle">Independent comparison</text><text x="500" y="384" font-size="16" text-anchor="middle" fill="#405569">Outcome / regressions / costs</text></g><g id="node-pass"><rect x="40" y="442" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="40" y="452" width="4" height="56" rx="2" fill="#147d76"/><text x="186" y="471" font-size="21" font-weight="700" text-anchor="middle">Pass in tested scope</text><text x="186" y="494" font-size="16" text-anchor="middle" fill="#405569">Exact receipt → human admission</text></g><g id="node-fail"><rect x="354" y="442" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="354" y="452" width="4" height="56" rx="2" fill="#a66b14"/><text x="500" y="471" font-size="21" font-weight="700" text-anchor="middle">Fail</text><text x="500" y="494" font-size="16" text-anchor="middle" fill="#405569">Hard negative or no improvement</text></g><g id="node-unknown"><rect x="668" y="442" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="668" y="452" width="4" height="56" rx="2" fill="#a66b14"/><text x="814" y="471" font-size="21" font-weight="700" text-anchor="middle">Inconclusive / blocked</text><text x="814" y="494" font-size="16" text-anchor="middle" fill="#405569">Missing proof; no admission</text></g><path d="M40 561H960" stroke="#cbd5e1"/><text x="40" y="582" font-size="14.5" fill="#526579">Predeclare metrics, repetitions and acceptance; preserve every attempt. Evidence review is necessary but not sufficient.</text></g></svg>