<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="492" viewBox="0 0 1000 492" role="img" aria-labelledby="title desc"><title id="title">Governed admission and rollback (#39)</title><desc id="desc">Exact accepted revisions and native ownership remain authoritative. Any later preauthorized effect requires separately accepted #44 policy and proof; no unapproved external effects.</desc><defs><marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526579"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8062ae"/></marker><marker id="gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a66b14"/></marker></defs><rect width="1000" height="492" rx="12" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#182c3e"><text x="40" y="29" font-size="14" font-weight="700" letter-spacing="1.2" fill="#147d76">ADAPTIVE AGENT ENVIRONMENT  /  ISSUE 39  /  PROPOSED DESIGN</text><text x="40" y="61" font-size="29" font-weight="700">Governed admission and rollback</text><text x="40" y="86" font-size="17" fill="#526579">Exact accepted revisions and native ownership remain authoritative</text><path d="M40 99H960" stroke="#cbd5e1"/><path id="edge-evidence-approve" d="M332 150H354" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-approve-owner" d="M646 150H668" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-owner-deploy" d="M814 188V222" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-deploy-verify" d="M668 260H646" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-verify-obs" d="M354 260H332" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-verify-rollback" d="M500 298V332" fill="none" stroke="#a66b14" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#gate)"/><path id="edge-rollback-prior" d="M646 370H668" fill="none" stroke="#a66b14" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#gate)"/><path id="edge-rollback-stop" d="M354 370H332" fill="none" stroke="#a66b14" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#gate)"/><g id="node-evidence"><rect x="40" y="112" width="292" height="76" rx="8" fill="#edf2f7" stroke="#63768b" stroke-width="1.6"/><rect x="40" y="122" width="4" height="56" rx="2" fill="#63768b"/><text x="186" y="141" font-size="21" font-weight="700" text-anchor="middle">Evaluated candidate · #35</text><text x="186" y="164" font-size="16" text-anchor="middle" fill="#405569">Identity + scoped receipt</text></g><g id="node-approve"><rect x="354" y="112" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="354" y="122" width="4" height="56" rx="2" fill="#a66b14"/><text x="500" y="141" font-size="21" font-weight="700" text-anchor="middle">Human admission</text><text x="500" y="164" font-size="16" text-anchor="middle" fill="#405569">Target / authority / recovery</text></g><g id="node-owner"><rect x="668" y="112" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="668" y="122" width="4" height="56" rx="2" fill="#147d76"/><text x="814" y="141" font-size="21" font-weight="700" text-anchor="middle">Owning interface</text><text x="814" y="164" font-size="16" text-anchor="middle" fill="#405569">Git / Fleet / native client</text></g><g id="node-obs"><rect x="40" y="222" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="40" y="232" width="4" height="56" rx="2" fill="#147d76"/><text x="186" y="251" font-size="21" font-weight="700" text-anchor="middle">Future use · #42 / #40</text><text x="186" y="274" font-size="16" text-anchor="middle" fill="#405569">Not inferred from installation</text></g><g id="node-verify"><rect x="354" y="222" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="354" y="232" width="4" height="56" rx="2" fill="#147d76"/><text x="500" y="251" font-size="21" font-weight="700" text-anchor="middle">Readback &amp; activation</text><text x="500" y="274" font-size="16" text-anchor="middle" fill="#405569">Exact revision, target, receipt</text></g><g id="node-deploy"><rect x="668" y="222" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="668" y="232" width="4" height="56" rx="2" fill="#147d76"/><text x="814" y="251" font-size="21" font-weight="700" text-anchor="middle">Scoped canary deploy</text><text x="814" y="274" font-size="16" text-anchor="middle" fill="#405569">Known prior accepted revision</text></g><g id="node-stop"><rect x="40" y="332" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="40" y="342" width="4" height="56" rx="2" fill="#a66b14"/><text x="186" y="361" font-size="21" font-weight="700" text-anchor="middle">Stop / residual state</text><text x="186" y="384" font-size="16" text-anchor="middle" fill="#405569">Unknown effect: inspect, no replay</text></g><g id="node-rollback"><rect x="354" y="332" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="354" y="342" width="4" height="56" rx="2" fill="#a66b14"/><text x="500" y="361" font-size="21" font-weight="700" text-anchor="middle">Explicit rollback approval</text><text x="500" y="384" font-size="16" text-anchor="middle" fill="#405569">Restore known revision via owner</text></g><g id="node-prior"><rect x="668" y="332" width="292" height="76" rx="8" fill="#eaf0fb" stroke="#466da7" stroke-width="1.6"/><rect x="668" y="342" width="4" height="56" rx="2" fill="#466da7"/><text x="814" y="361" font-size="21" font-weight="700" text-anchor="middle">Verified prior revision</text><text x="814" y="384" font-size="16" text-anchor="middle" fill="#405569">Readback again; preserve others</text></g><path d="M40 451H960" stroke="#cbd5e1"/><text x="40" y="472" font-size="14.5" fill="#526579">Any later preauthorized effect requires separately accepted #44 policy and proof; no unapproved external effects.</text></g></svg>