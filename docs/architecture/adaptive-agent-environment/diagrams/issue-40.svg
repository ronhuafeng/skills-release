 rx="2" fill="#147d76"/><text x="186" y="471" font-size="21" font-weight="700" text-anchor="middle">Retain / gather evidence</text><text x="186" y="494" font-size="16" text-anchor="middle" fill="#405569">Preserve rare-use safety rules</text></g><g id="node-revise"><rect x="354" y="442" width="292" height="76" rx="8" fill="#f0ecfa" stroke="#8062ae" stroke-width="1.6"/><rect x="354" y="452" width="4" height="56" rx="2" fill="#8062ae"/><text x="500" y="471" font-size="21" font-weight="700" text-anchor="middle">Revise / narrow / retire</text><text x="500" y="494" font-size="16" text-anchor="middle" fill="#405569">New evidence → #33</text></g><g id="node-regress"><rect x="668" y="442" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="668" y="452" width="4" height="56" rx="2" fill="#a66b14"/><text x="814" y="471" font-size="21" font-weight="700" text-anchor="middle">Regression / stop</text><text x="814" y="494" font-size="16" text-anchor="middle" fill="#405569">Propose explicit recovery → #39</text></g><path d="M40 561H960" stroke="#cbd5e1"/><text x="40" y="582" font-size="14.5" fill="#526579">Report actual vs estimated ROI, confounders and missing denominators; do not attribute every change to learned knowledge.</text></g></svg>