<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="602" viewBox="0 0 1000 602" role="img" aria-labelledby="title desc"><title id="title">Observed outcomes and revision (#40)</title><desc id="desc">Exposure is not use; use is not proof of benefit. Report actual vs estimated ROI, confounders and missing denominators; do not attribute every change to learned knowledge.</desc><defs><marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526579"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8062ae"/></marker><marker id="gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a66b14"/></marker></defs><rect width="1000" height="602" rx="12" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#182c3e"><text x="40" y="29" font-size="14" font-weight="700" letter-spacing="1.2" fill="#147d76">ADAPTIVE AGENT ENVIRONMENT  /  ISSUE 40  /  PROPOSED DESIGN</text><text x="40" y="61" font-size="29" font-weight="700">Observed outcomes and revision</text><text x="40" y="86" font-size="17" fill="#526579">Exposure is not use; use is not proof of benefit</text><path d="M40 99H960" stroke="#cbd5e1"/><path id="edge-deploy-exposure" d="M251 188V205H435V222" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-session-exposure" d="M749 188V205H565V222" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-exposure-measure" d="M500 298V332" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-measure-retain" d="M435 408V425H251V442" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-measure-revise" d="M500 408V442" fill="none" stroke="#8062ae" stroke-width="2.2" stroke-dash