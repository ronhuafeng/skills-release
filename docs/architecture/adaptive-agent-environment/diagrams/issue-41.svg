<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="602" viewBox="0 0 1000 602" role="img" aria-labelledby="title desc"><title id="title">Dual-rate continual learning (#41)</title><desc id="desc">Fast observation and slow consolidation share durable evidence. Manual-first; optional scheduling only with real native support. Fast-loop evidence cannot change the active environment.</desc><defs><marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526579"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8062ae"/></marker><marker id="gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a66b14"/></marker></defs><rect width="1000" height="602" rx="12" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#182c3e"><text x="40" y="29" font-size="14" font-weight="700" letter-spacing="1.2" fill="#147d76">ADAPTIVE AGENT ENVIRONMENT  /  ISSUE 41  /  PROPOSED DESIGN</text><text x="40" y="61" font-size="29" font-weight="700">Dual-rate continual learning</text><text x="40" y="86" font-size="17" fill="#526579">Fast observation and slow consolidation share durable evidence</text><path d="M40 99H960" stroke="#cbd5e1"/><path id="edge-new-filter" d="M186 188V222" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-filter-extract" d="M186 298V332" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-extract-ledger" d="M251 332V315H435V298" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-ledger-slow" d="M565 222V205H749V188" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-slow-eval" d="M814 188V222" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-eval-admit" d="M814 298V332" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-admit-out" d="M814 408V442" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-extract-defer" d="M186 408V442" fill="none" stroke="#a66b14" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#gate)"/><path id="edge-out-new" d="M814 518V547H15V150H40" fill="none" stroke="#8062ae" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#feedback)"/><g id="node-new"><rect x="40" y="112" width="292" height="76" rx="8" fill="#edf2f7" stroke="#63768b" stroke-width="1.6"/><rect x="40" y="122" width="4" height="56" rx="2" fill="#63768b"/><text x="186" y="141" font-size="21" font-weight="700" text-anchor="middle">FAST · New session/event</text><text x="186" y="164" font-size="16" text-anchor="middle" fill="#405569">Explicit or approved native trigger</text></g><g id="node-slow"><rect x="668" y="112" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="668" y="122" width="4" height="56" rx="2" fill="#147d76"/><text x="814" y="141" font-size="21" font-weight="700" text-anchor="middle">SLOW · Consolidate</text><text x="814" y="164" font-size="16" text-anchor="middle" fill="#405569">Material evidence / budget / scope</text></g><g id="node-filter"><rect x="40" y="222" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="40" y="232" width="4" height="56" rx="2" fill="#147d76"/><text x="186" y="251" font-size="21" font-weight="700" text-anchor="middle">Deterministic prefilter</text><text x="186" y="274" font-size="16" text-anchor="middle" fill="#405569">No-op unchanged; redact / bound</text></g><g id="node-ledger"><rect x="354" y="222" width="292" height="76" rx="8" fill="#eaf0fb" stroke="#466da7" stroke-width="1.6"/><rect x="354" y="232" width="4" height="56" rx="2" fill="#466da7"/><text x="500" y="251" font-size="21" font-weight="700" text-anchor="middle">Private evidence pool</text><text x="500" y="274" font-size="16" text-anchor="middle" fill="#405569">Committed cursor + candidates</text></g><g id="node-eval"><rect x="668" y="222" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="668" y="232" width="4" height="56" rx="2" fill="#147d76"/><text x="814" y="251" font-size="21" font-weight="700" text-anchor="middle">Verify &amp; evaluate</text><text x="814" y="274" font-size="16" text-anchor="middle" fill="#405569">#33 / #34 / #35</text></g><g id="node-extract"><rect x="40" y="332" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="40" y="342" width="4" height="56" rx="2" fill="#147d76"/><text x="186" y="361" font-size="21" font-weight="700" text-anchor="middle">Lightweight extraction</text><text x="186" y="384" font-size="16" text-anchor="middle" fill="#405569">Only high-value new signals</text></g><g id="node-admit"><rect x="668" y="332" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="668" y="342" width="4" height="56" rx="2" fill="#a66b14"/><text x="814" y="361" font-size="21" font-weight="700" text-anchor="middle">Admission &amp; use</text><text x="814" y="384" font-size="16" text-anchor="middle" fill="#405569">#39 / #42; authority separate</text></g><g id="node-defer"><rect x="40" y="442" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="40" y="452" width="4" height="56" rx="2" fill="#a66b14"/><text x="186" y="471" font-size="21" font-weight="700" text-anchor="middle">Defer / stop</text><text x="186" y="494" font-size="16" text-anchor="middle" fill="#405569">Budget or missing evidence</text></g><g id="node-out"><rect x="668" y="442" width="292" height="76" rx="8" fill="#f0ecfa" stroke="#8062ae" stroke-width="1.6"/><rect x="668" y="452" width="4" height="56" rx="2" fill="#8062ae"/><text x="814" y="471" font-size="21" font-weight="700" text-anchor="middle">Observe actual outcome</text><text x="814" y="494" font-size="16" text-anchor="middle" fill="#405569">#40; evidence for next cycle</text></g><path d="M40 561H960" stroke="#cbd5e1"/><text x="40" y="582" font-size="14.5" fill="#526579">Manual-first; optional scheduling only with real native support. Fast-loop evidence cannot change the active environment.</text></g></svg>