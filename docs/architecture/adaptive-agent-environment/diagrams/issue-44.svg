<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="712" viewBox="0 0 1000 712" role="img" aria-labelledby="title desc"><title id="title">Progressive autonomy, bounded by authority (#44)</title><desc id="desc">Each level is independently opt-in; higher levels are conditional. L3/L4 require a separate accepted decision, real native authority, negative/live proof and a disable path. Never self-escalate.</desc><defs><marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526579"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8062ae"/></marker><marker id="gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a66b14"/></marker></defs><rect width="1000" height="712" rx="12" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#182c3e"><text x="40" y="29" font-size="14" font-weight="700" letter-spacing="1.2" fill="#147d76">ADAPTIVE AGENT ENVIRONMENT  /  ISSUE 44  /  PROPOSED DESIGN</text><text x="40" y="61" font-size="29" font-weight="700">Progressive autonomy, bounded by authority</text><text x="40" y="86" font-size="17" fill="#526579">Each level is independently opt-in; higher levels are conditional</text><path d="M40 99H960" stroke="#cbd5e1"/><path id="edge-l0-l1" d="M186 188V222" fill="none" stroke="#8062ae" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#feedback)"/><path id="edge-l1-l2" d="M186 298V332" fill="none" stroke="#8062ae" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#feedback)"/><path id="edge-l2-l3" d="M186 408V442" fill="none" stroke="#8062ae" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#feedback)"/><path id="edge-l3-l4" d="M186 518V552" fill="none" stroke="#8062ae" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#feedback)"/><path id="edge-policy-gate" d="M814 188V222" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-gate-effect" d="M814 298V332" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-gate-deny" d="M960 260H985V480H960" fill="none" stroke="#a66b14" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#gate)"/><path id="edge-effect-receipt" d="M668 370H656V590H668" fill="none" stroke="#526579" stroke-width="2.2" marker-end="url(#normal)"/><path id="edge-deny-receipt" d="M814 518V552" fill="none" stroke="#a66b14" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#gate)"/><g id="node-l0"><rect x="40" y="112" width="292" height="76" rx="8" fill="#edf2f7" stroke="#63768b" stroke-width="1.6"/><rect x="40" y="122" width="4" height="56" rx="2" fill="#63768b"/><text x="186" y="141" font-size="21" font-weight="700" text-anchor="middle">L0 · Manual</text><text x="186" y="164" font-size="16" text-anchor="middle" fill="#405569">Default: inspect and propose</text></g><g id="node-policy"><rect x="668" y="112" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="668" y="122" width="4" height="56" rx="2" fill="#a66b14"/><text x="814" y="141" font-size="21" font-weight="700" text-anchor="middle">Versioned policy</text><text x="814" y="164" font-size="16" text-anchor="middle" fill="#405569">Actor / scope / risk / budget / expiry</text></g><g id="node-l1"><rect x="40" y="222" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="40" y="232" width="4" height="56" rx="2" fill="#147d76"/><text x="186" y="251" font-size="21" font-weight="700" text-anchor="middle">L1 · Observe</text><text x="186" y="274" font-size="16" text-anchor="middle" fill="#405569">Approved schedule / private candidates</text></g><g id="node-gate"><rect x="668" y="222" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="668" y="232" width="4" height="56" rx="2" fill="#a66b14"/><text x="814" y="251" font-size="21" font-weight="700" text-anchor="middle">Preflight every effect</text><text x="814" y="274" font-size="16" text-anchor="middle" fill="#405569">Exact target, proof, native authority</text></g><g id="node-l2"><rect x="40" y="332" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="40" y="342" width="4" height="56" rx="2" fill="#147d76"/><text x="186" y="361" font-size="21" font-weight="700" text-anchor="middle">L2 · Experiment</text><text x="186" y="384" font-size="16" text-anchor="middle" fill="#405569">Isolated, preauthorized budget</text></g><g id="node-effect"><rect x="668" y="332" width="292" height="76" rx="8" fill="#e6f5f2" stroke="#147d76" stroke-width="1.6"/><rect x="668" y="342" width="4" height="56" rx="2" fill="#147d76"/><text x="814" y="361" font-size="21" font-weight="700" text-anchor="middle">Allowed scoped effect</text><text x="814" y="384" font-size="16" text-anchor="middle" fill="#405569">Only if policy and proof permit</text></g><g id="node-l3"><rect x="40" y="442" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="40" y="452" width="4" height="56" rx="2" fill="#a66b14"/><text x="186" y="471" font-size="21" font-weight="700" text-anchor="middle">L3 · Adapt</text><text x="186" y="494" font-size="16" text-anchor="middle" fill="#405569">Conditional reversible canary</text></g><g id="node-deny"><rect x="668" y="442" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="668" y="452" width="4" height="56" rx="2" fill="#a66b14"/><text x="814" y="471" font-size="21" font-weight="700" text-anchor="middle">Deny / revoke / stop</text><text x="814" y="494" font-size="16" text-anchor="middle" fill="#405569">No privilege or scope expansion</text></g><g id="node-l4"><rect x="40" y="552" width="292" height="76" rx="8" fill="#fff4de" stroke="#a66b14" stroke-width="1.6"/><rect x="40" y="562" width="4" height="56" rx="2" fill="#a66b14"/><text x="186" y="581" font-size="21" font-weight="700" text-anchor="middle">L4 · Bounded recovery</text><text x="186" y="604" font-size="16" text-anchor="middle" fill="#405569">Conditional prior-revision restore</text></g><g id="node-receipt"><rect x="668" y="552" width="292" height="76" rx="8" fill="#eaf0fb" stroke="#466da7" stroke-width="1.6"/><rect x="668" y="562" width="4" height="56" rx="2" fill="#466da7"/><text x="814" y="581" font-size="21" font-weight="700" text-anchor="middle">Readback &amp; residual state</text><text x="814" y="604" font-size="16" text-anchor="middle" fill="#405569">Inspect, reconcile or escalate</text></g><path d="M40 671H960" stroke="#cbd5e1"/><text x="40" y="692" font-size="14.5" fill="#526579">L3/L4 require a separate accepted decision, real native authority, negative/live proof and a disable path. Never self-escalate.</text></g></svg>