[project]
name = "skills-snapshot-plan"
version = "0.1.0"
description = "API-only planning and content identity for managed directory snapshots."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8.0"]
