[project]
name = "skills-symlink-mutation"
version = "0.1.0"
description = "Primitive APIs for applying validated symlink plans."
requires-python = ">=3.11"
dependencies = [
  "skills-symlink-plan",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
